<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Dashboard - Vehicle Verification Portal</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="layout">
        <div id="welcomeBar"></div>

        <section class="stats-grid">
            <div class="stat-card police">
                <div class="stat-header">
                    <div class="stat-icon police">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17H2"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="vehicleCount">0</div>
                <div class="stat-label">My Vehicles</div>
                <div class="stat-trend">Registered</div>
            </div>

            <div class="stat-card success">
                <div class="stat-header">
                    <div class="stat-icon success">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="pucStatus">Valid</div>
                <div class="stat-label">PUC Status</div>
                <div class="stat-trend" id="pucTrend">Expires in 45 days</div>
            </div>

            <div class="stat-card warning">
                <div class="stat-header">
                    <div class="stat-icon warning">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="insuranceStatus">Active</div>
                <div class="stat-label">Insurance</div>
                <div class="stat-trend" id="insuranceTrend">Renews in 120 days</div>
            </div>

            <div class="stat-card danger">
                <div class="stat-header">
                    <div class="stat-icon danger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="pendingChallanCount">0</div>
                <div class="stat-label">Pending Challans</div>
                <div class="stat-trend" id="challanTrend">Clean Record</div>
            </div>
        </section>

        <section class="content-grid">
            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">My Vehicles</h3>
                    <div class="panel-actions">
                        <span class="status-badge valid" id="activeVehicleBadge">1 Active</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Vehicle No.</th>
                                    <th>Type</th>
                                    <th>PUC Valid Till</th>
                                    <th>Insurance</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="myVehiclesTbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">Quick Services</h3>
                </div>
                <div class="panel-body">
                    <div class="quick-links" style="display: grid; grid-template-columns: 1fr; gap: 12px;">
                        <a href="pay-challan.html" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                            Pay Challan
                        </a>
                        <a href="citizen-challan-history.html" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            Challan History
                        </a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="../js/data.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        (function() {
            const TODAY = new Date(2026, 7, 6);
            const DTF = new Intl.NumberFormat('en-IN');

            function dmy(d) {
                const da = new Date(d + 'T00:00:00');
                return String(da.getDate()).padStart(2,'0') + ' ' + da.toLocaleString('en-IN',{month:'short'}) + ' ' + da.getFullYear();
            }
            function daysDiff(dateIso) {
                const d = new Date(dateIso + 'T00:00:00');
                return Math.round((d - TODAY) / (24 * 3600 * 1000));
            }

            function populateMyVehicles(tbodyId) {
                console.log('populateMyVehicles called');
                const tb = document.getElementById(tbodyId);
                if (!tb || !window.VehicleData) {
                    console.log('Table or VehicleData not available. Table:', !!tb, 'VehicleData:', !!window.VehicleData);
                    return;
                }

                // Get authenticated user's vehicle from API
                const auth = JSON.parse(localStorage.getItem('vehical_auth_data') || '{}');
                const userVehicleNumber = auth.user?.vehicleNumber || auth.user?.username;
                console.log('User vehicle number from auth (vehicleNumber or username):', userVehicleNumber);
                console.log('Full auth data:', auth);

                if (!userVehicleNumber) {
                    tb.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748B;">No vehicle associated with your account</td></tr>';
                    return;
                }

                // Find vehicle in demo database (for table display only)
                const normUserVehicle = userVehicleNumber.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                const vehicle = (VehicleData.VEHICLES || []).find(v => {
                    const normReg = v.reg.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                    return normReg === normUserVehicle;
                });

                // Get PUC and Insurance data from demo (only if vehicle found in demo data)
                const puc = vehicle ? VehicleData.getPUCByReg(vehicle.reg) : null;
                const policy = vehicle ? VehicleData.getPolicyByReg(vehicle.reg) : null;

                // Fetch challans from the backend database (always - independent of demo data)
                fetch('/api/challan/vehicle?vehicleNo=' + encodeURIComponent(userVehicleNumber))
                    .then(r => r.json())
                    .then(result => {
                        const challans = (result && result.success && Array.isArray(result.data)) ? result.data : [];

                        // Pending = status PENDING_PAYMENT and payment_status not Paid
                        const pendingChallans = challans.filter(c => {
                            const isPaid = (c.paymentStatus || '').toLowerCase() === 'paid' || c.status === 'PAID';
                            return !isPaid;
                        });

                        // Update stats
                        document.getElementById('vehicleCount').textContent = '1';
                        document.getElementById('pendingChallanCount').textContent = pendingChallans.length;
                        document.getElementById('challanTrend').textContent = pendingChallans.length > 0 ? pendingChallans.length + ' Pending' : 'Clean Record';
                    })
                    .catch(err => {
                        console.error('Error fetching challans:', err);
                        document.getElementById('pendingChallanCount').textContent = '0';
                        document.getElementById('challanTrend').textContent = 'Clean Record';
                    });

                // Update PUC status
                if (puc) {
                    const daysLeft = daysDiff(puc.validDateIso);
                    if (daysLeft < 0) {
                        document.getElementById('pucStatus').textContent = 'Expired';
                        document.getElementById('pucStatus').parentElement.parentElement.className = 'stat-card danger';
                        document.getElementById('pucTrend').textContent = 'Expired on ' + dmy(puc.validDateIso);
                    } else if (daysLeft <= 30) {
                        document.getElementById('pucStatus').textContent = 'Expiring';
                        document.getElementById('pucStatus').parentElement.parentElement.className = 'stat-card warning';
                        document.getElementById('pucTrend').textContent = 'Expires in ' + daysLeft + ' days';
                    } else {
                        document.getElementById('pucStatus').textContent = 'Valid';
                        document.getElementById('pucTrend').textContent = 'Expires in ' + daysLeft + ' days';
                    }
                }

                // Update Insurance status
                if (policy) {
                    const daysLeft = daysDiff(policy.endDateIso);
                    if (daysLeft < 0) {
                        document.getElementById('insuranceStatus').textContent = 'Expired';
                        document.getElementById('insuranceStatus').parentElement.parentElement.className = 'stat-card danger';
                        document.getElementById('insuranceTrend').textContent = 'Expired on ' + dmy(policy.endDateIso);
                    } else if (daysLeft <= 45) {
                        document.getElementById('insuranceStatus').textContent = 'Renewal Due';
                        document.getElementById('insuranceStatus').parentElement.parentElement.className = 'stat-card warning';
                        document.getElementById('insuranceTrend').textContent = 'Renews in ' + daysLeft + ' days';
                    } else {
                        document.getElementById('insuranceStatus').textContent = 'Active';
                        document.getElementById('insuranceTrend').textContent = 'Renews in ' + daysLeft + ' days';
                    }
                }

                // Populate vehicles table
                if (vehicle) {
                    const pucStatus = puc ? (puc.status === 'Pass' ? 'Valid' : puc.status) : 'N/A';
                    const pucValidTill = puc ? dmy(puc.validDateIso) : 'N/A';
                    const insuranceStatus = policy ? policy.status : 'N/A';

                    tb.innerHTML = `
                        <tr>
                            <td><strong>${vehicle.reg}</strong></td>
                            <td>${vehicle.vehicleType}</td>
                            <td>${pucValidTill}</td>
                            <td>${insuranceStatus}</td>
                            <td><span class="status-badge ${pucStatus === 'Valid' ? 'valid' : (pucStatus === 'Expired' ? 'expired' : 'pending')}">${pucStatus}</span></td>
                        </tr>
                    `;
                } else {
                    // Vehicle not in demo data but exists in Oracle DB (citizen login succeeded)
                    tb.innerHTML = `
                        <tr>
                            <td><strong>${userVehicleNumber}</strong></td>
                            <td>N/A</td>
                            <td>N/A</td>
                            <td>N/A</td>
                            <td><span class="status-badge valid">Active</span></td>
                        </tr>
                    `;
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                // Initialize dashboard with citizen role
                const auth = DashboardApp.init(['CITIZEN'], 'Citizen Portal', 'overview');
                if (auth) {
                    populateMyVehicles('myVehiclesTbody');
                }
            });
        })();
    </script>
</body>
</html>
