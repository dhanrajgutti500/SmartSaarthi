<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challan History - Citizen Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="layout">
        <div id="welcomeBar"></div>

        <section class="stats-grid">
            <div class="stat-card police">
                <div class="stat-header">
                    <div class="stat-icon police">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="totalChallans">0</div>
                <div class="stat-label">Total Challans</div>
                <div class="stat-trend">All Time</div>
            </div>

            <div class="stat-card warning">
                <div class="stat-header">
                    <div class="stat-icon warning">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="pendingChallans">0</div>
                <div class="stat-label">Pending</div>
                <div class="stat-trend">Unpaid</div>
            </div>

            <div class="stat-card success">
                <div class="stat-header">
                    <div class="stat-icon success">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="paidChallans">0</div>
                <div class="stat-label">Paid</div>
                <div class="stat-trend">Completed</div>
            </div>

            <div class="stat-card danger">
                <div class="stat-header">
                    <div class="stat-icon danger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </div>
                </div>
                <div class="stat-value" id="totalAmount">₹0</div>
                <div class="stat-label">Total Paid</div>
                <div class="stat-trend">Lifetime</div>
            </div>
        </section>

        <section class="content-grid">
            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">Challan History</h3>
                    <div class="panel-actions">
                        <a href="pay-challan.html" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                            Pay Pending Challans
                        </a>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Challan No.</th>
                                    <th>Violation</th>
                                    <th>Date</th>
                                    <th>Location</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="challanHistoryTbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                // Initialize dashboard with citizen role
                const auth = DashboardApp.init(['CITIZEN'], 'Citizen Portal', 'history');
                if (auth) {
                    loadChallanHistory();
                }
            });

            function loadChallanHistory() {
                const auth = JSON.parse(localStorage.getItem('vehical_auth_data') || '{}');
                const vehicleNumber = auth.user?.vehicleNumber || auth.user?.username;

                if (!vehicleNumber) {
                    document.getElementById('challanHistoryTbody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748B;">No data available</td></tr>';
                    return;
                }

                const tbody = document.getElementById('challanHistoryTbody');
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748B;">Loading challan history...</td></tr>';

                fetch('/api/challan/vehicle?vehicleNo=' + encodeURIComponent(vehicleNumber))
                    .then(r => r.json())
                    .then(result => {
                        const challans = (result && result.success && Array.isArray(result.data)) ? result.data : [];

                        let totalPaid = 0;
                        let pendingCount = 0;
                        let paidCount = 0;
                        let html = '';

                        if (challans.length === 0) {
                            html = '<tr><td colspan="7" style="text-align:center; color:#64748B;">No challan history found</td></tr>';
                        } else {
                            html = challans.map(c => {
                                const isPaid = (c.paymentStatus || '').toLowerCase() === 'paid' || c.status === 'PAID';
                                const statusLabel = isPaid ? 'Paid' : 'Pending';

                                if (isPaid) {
                                    totalPaid += c.totalFineAmount;
                                    paidCount++;
                                } else {
                                    pendingCount++;
                                }

                                // Format date from YYYY-MM-DD to DD-MM-YYYY
                                let dateStr = c.challanDate || '';
                                if (dateStr) {
                                    const parts = dateStr.split('-');
                                    if (parts.length === 3) {
                                        dateStr = parts[2] + '-' + parts[1] + '-' + parts[0];
                                    }
                                }

                                return `
                                    <tr>
                                        <td><strong>${c.challanNumber}</strong></td>
                                        <td>${c.violationName || 'Traffic Violation'}</td>
                                        <td>${dateStr}</td>
                                        <td>${c.location || 'N/A'}</td>
                                        <td>₹${c.totalFineAmount}</td>
                                        <td><span class="status-badge ${statusLabel === 'Paid' ? 'valid' : 'pending'}">${statusLabel}</span></td>
                                        <td>
                                            ${!isPaid ? `
                                                <a href="pay-challan.html?challanNo=${encodeURIComponent(c.challanNumber)}" class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;">Pay</a>
                                            ` : `
                                                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="viewReceipt('${c.challanNumber}')">Receipt</button>
                                            `}
                                        </td>
                                    </tr>
                                `;
                            }).join('');
                        }

                        tbody.innerHTML = html;

                        // Update stats
                        document.getElementById('totalChallans').textContent = challans.length;
                        document.getElementById('pendingChallans').textContent = pendingCount;
                        document.getElementById('paidChallans').textContent = paidCount;
                        document.getElementById('totalAmount').textContent = '₹' + totalPaid;
                    })
                    .catch(err => {
                        console.error('Error loading challan history:', err);
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#E11D48;">Failed to load challan history. Please try again.</td></tr>';
                    });
            }

            window.viewReceipt = function(challanNo) {
                const auth = JSON.parse(localStorage.getItem('vehical_auth_data') || '{}');
                const vehicleNumber = auth.user?.vehicleNumber || auth.user?.username || '';
                const receiptUrl = `challan-receipt.html?challanNo=${encodeURIComponent(challanNo)}&vehicleNo=${encodeURIComponent(vehicleNumber)}`;
                window.open(receiptUrl, '_blank');
            };
        })();
    </script>
</body>
</html>
